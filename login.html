<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | RDA Trust</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e0f2f1; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #00695c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004d40; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="color: #00695c;">Member Login</h2>
        
        <div id="emailSection">
            <p>Enter your registered email to get OTP.</p>
            <input type="email" id="email" placeholder="rdamember@example.com">
            <button onclick="sendOTP()">Send OTP</button>
        </div>

        <div id="otpSection" class="hidden">
            <p>OTP sent! Check your inbox.</p>
            <input type="text" id="otp" placeholder="Enter 6-digit OTP">
            <button onclick="verifyOTP()">Login</button>
        </div>

        <p id="status" style="color: red; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>

    <script src="config.js"></script>
    <script>
        let userEmail = "";

        async function sendOTP() {
            userEmail = document.getElementById('email').value;
            const status = document.getElementById('status');
            
            if(!userEmail) { status.innerText = "Please enter email."; return; }

            status.innerText = "Sending OTP...";
            
            const { data, error } = await supabase.auth.signInWithOtp({
                email: userEmail
            });

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "";
                document.getElementById('emailSection').classList.add('hidden');
                document.getElementById('otpSection').classList.remove('hidden');
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value;
            const status = document.getElementById('status');

            status.innerText = "Verifying...";

            const { data, error } = await supabase.auth.verifyOtp({
                email: userEmail,
                token: otp,
                type: 'magiclink' // or 'email' depending on config, usually 'email' for simple OTP
            });

            // Sometimes type needs to be 'email' for numeric OTPs
            if (error) {
                // Try alternate type if magiclink fails
                const { data: data2, error: error2 } = await supabase.auth.verifyOtp({
                    email: userEmail,
                    token: otp,
                    type: 'email'
                });
                
                if (error2) {
                    status.innerText = "Invalid OTP. Try again.";
                    return;
                }
            }

            // Success
            status.style.color = "green";
            status.innerText = "Success! Redirecting...";
            setTimeout(() => { window.location.href = "chat.html"; }, 1000);
        }
    </script>
</body>
</html>
