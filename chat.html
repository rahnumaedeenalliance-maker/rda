<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDA Chat Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* (Reuse the CSS I gave you in the previous response for chat.html) */
        /* Basic Styles */
        body { margin:0; font-family:sans-serif; background:#e0f2f1; display:flex; flex-direction:column; height:100vh; }
        .header { background:#00695c; color:white; padding:15px; display:flex; justify-content:space-between; }
        .chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:70%; padding:10px; border-radius:10px; background:white; align-self:flex-start; font-size:0.95rem; }
        .my-msg { background:#00695c; color:white; align-self:flex-end; }
        .sender-name { font-size:0.75rem; color:#555; margin-bottom:2px; display:block; }
        .my-msg .sender-name { color:#ddd; text-align:right; }
        .input-area { padding:15px; background:white; display:flex; gap:10px; }
        input { flex:1; padding:10px; border:1px solid #ccc; border-radius:20px; }
        button { padding:10px 20px; background:#00695c; color:white; border:none; border-radius:20px; cursor:pointer; }
    </style>
</head>
<body>

    <div class="header">
        <span>RDA Official Chat</span>
        <button onclick="logout()" style="background:#d32f2f; padding:5px 15px;">Logout</button>
    </div>

    <div class="chat-box" id="chatBox">
        <p style="text-align:center; color:#888;">Loading messages...</p>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script src="config.js"></script>
    <script>
        let currentUser = null;

        // 1. Check Login Status on Load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "login.html"; // Redirect if not logged in
            } else {
                currentUser = session.user;
                loadMessages();
                subscribeToMessages();
            }
        }
        checkSession();

        // 2. Load Old Messages
        async function loadMessages() {
            const chatBox = document.getElementById('chatBox');
            // Fetch messages and the profile name of the sender
            const { data, error } = await supabase
                .from('messages')
                .select('content, user_id, profiles(full_name)')
                .order('created_at', { ascending: true });

            if (error) console.error(error);
            
            chatBox.innerHTML = ""; // Clear loading text
            
            data.forEach(msg => {
                displayMessage(msg);
            });
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
        }

        // 3. Display a single message HTML
        function displayMessage(msg) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const isMe = msg.user_id === currentUser.id;
            
            div.className = isMe ? "msg my-msg" : "msg";
            
            // Safety check for name
            const senderName = msg.profiles ? msg.profiles.full_name : "Unknown Member";
            
            div.innerHTML = `
                <span class="sender-name">${isMe ? "You" : senderName}</span>
                ${msg.content}
            `;
            chatBox.appendChild(div);
        }

        // 4. Send Message
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const { error } = await supabase
                .from('messages')
                .insert({ content: text, user_id: currentUser.id });

            if (error) alert("Error sending: " + error.message);
            else input.value = ""; // Clear input
        }

        // 5. Real-time Subscription (Live Chat)
        function subscribeToMessages() {
            supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, 
                async (payload) => {
                    // Fetch profile name for the new message
                    const { data } = await supabase
                        .from('profiles')
                        .select('full_name')
                        .eq('id', payload.new.user_id)
                        .single();
                    
                    const newMsg = {
                        content: payload.new.content,
                        user_id: payload.new.user_id,
                        profiles: data
                    };
                    displayMessage(newMsg);
                    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                })
                .subscribe();
        }

        // 6. Logout
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
